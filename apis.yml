name: Prisms VR
description: >-
  Prisms VR (Prisms) is an educational technology company building what it calls
  the world's first spatial learning platform, where students learn core math,
  science, and other subjects by abstracting up from immersive, first-person
  physical experiences delivered in virtual reality. Founded by MIT
  engineer-turned-educator Anurupa Ganguly, the teacher-facing platform uses
  kinesthetic, embodied learning to help students grasp abstract concepts and
  aims to develop curious, resilient thinkers. Prisms is an a16z portfolio
  company; it was added to the API Evangelist network as a lead and profiled
  through the enrichment pipeline. As of this pass the company publishes no
  public developer API, SDK, or developer portal surface.
